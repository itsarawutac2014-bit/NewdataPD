<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบจัดการพนักงาน | ระบบบันทึกประวัติและอายุงาน ฝ่ายผลิต</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Auth Engine -->
  <script src="assets/js/auth.js"></script>

  <style>
    * {
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fed7aa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0.75rem;
    }
    .login-card {
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(234, 88, 12, 0.18);
      background: #ffffff;
      border: 1px solid rgba(255, 121, 0, 0.2);
      overflow: hidden;
      width: 100%;
      max-width: 440px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-orange {
      background: linear-gradient(135deg, #ff7900, #ea580c);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
      transition: all 0.2s ease;
    }
    .btn-orange:hover, .btn-orange:focus {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.45);
    }
    .input-group-text {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }
    .form-control {
      border-color: #cbd5e1;
    }
    .form-control:focus {
      border-color: #ff7900;
      box-shadow: 0 0 0 0.25rem rgba(255, 121, 0, 0.18);
    }
  </style>
</head>
<body>

<div class="container p-2">
  <div class="login-card mx-auto">
    <!-- Header Gradient Banner -->
    <div class="p-4 p-md-5 text-center" style="background: linear-gradient(135deg, #ff7900, #ea580c); color: white;">
      <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle shadow mb-3" style="width: 76px; height: 76px;">
        <i class="fas fa-shield-halved fs-1" style="color: #ff7900;"></i>
      </div>
      <h4 class="fw-bold mb-1">เข้าสู่ระบบจัดการพนักงาน</h4>
      <p class="mb-0 text-white-50 small">ระบบรักษาความปลอดภัย & บันทึกประวัติฝ่ายผลิต</p>
    </div>

    <!-- Login Form Area -->
    <div class="p-4 p-md-5">
      <!-- Flash Alert Placeholder -->
      <div id="login-alert" class="alert alert-danger alert-dismissible fade show border-0 small mb-4 d-none" role="alert">
        <span id="login-alert-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
        <button type="button" class="btn-close" onclick="document.getElementById('login-alert').classList.add('d-none')"></button>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold text-secondary small">ชื่อผู้ใช้งาน (Username)</label>
          <div class="input-group">
            <span class="input-group-text border-end-0"><i class="fas fa-user text-muted"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="ระบุชื่อผู้ใช้" value="Admin" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold text-secondary small">รหัสผ่าน (Password)</label>
          <div class="input-group">
            <span class="input-group-text border-end-0"><i class="fas fa-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="ระบุรหัสผ่าน" value="12345" required>
            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility()">
              <i class="fas fa-eye text-muted" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-orange py-2.5 rounded-3 fw-bold">
            <i class="fas fa-sign-in-alt me-1"></i> เข้าสู่ระบบ
          </button>
        </div>

        <!-- Master Account Hint Box -->
        <div class="p-3 bg-light rounded-3 border text-center small text-muted">
          <div class="fw-bold text-dark mb-1"><i class="fas fa-key text-warning me-1"></i> บัญชีผู้ดูแลระบบตั้งต้น (Master Admin)</div>
          <div>ชื่อผู้ใช้งาน: <strong class="text-primary font-monospace">Admin</strong> | รหัสผ่าน: <strong class="text-danger font-monospace">12345</strong></div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Check if already logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (Auth.isLoggedIn()) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect') || 'dashboard.html';
      window.location.replace(redirectUrl);
    }
  });

  function togglePasswordVisibility() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash text-muted';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye text-muted';
    }
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    const alertBox = document.getElementById('login-alert');
    const alertText = document.getElementById('login-alert-text');
    alertBox.classList.add('d-none');

    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();

    const res = Auth.login(u, p);
    if (res.success) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect') || 'dashboard.html';
      window.location.replace(redirectUrl);
    } else {
      alertText.textContent = res.message;
      alertBox.classList.remove('d-none');
    }
  }
</script>
</body>
</html>
